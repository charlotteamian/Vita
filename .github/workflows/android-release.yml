name: Publish Android update

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vita-android-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'charlotteamian/Vita' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'
      - name: Check version ordering
        id: version
        run: python3 scripts/check_release_version.py
      - name: Check release tooling and optional AI bridge
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s ai-server -p 'test_*.py'
      - name: Restore the original signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.VITA_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_B64"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vita-original.keystore"
      - name: Test, lint and build the signed update
        env:
          VITA_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/vita-original.keystore
          VITA_SIGNING_STORE_PASSWORD: ${{ secrets.VITA_SIGNING_STORE_PASSWORD }}
          VITA_SIGNING_KEY_ALIAS: ${{ secrets.VITA_SIGNING_KEY_ALIAS }}
          VITA_SIGNING_KEY_PASSWORD: ${{ secrets.VITA_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testPersonalUnitTest :app:lintPersonal :app:assemblePersonal --no-configuration-cache --console=plain
      - name: Verify package, certificate and version
        run: python3 scripts/verify_apk.py --apk app/build/outputs/apk/personal/app-personal.apk --output-dir build/distribution
      - name: Publish the verified update
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION_NAME']
          Path('build/distribution/release-notes.md').write_text(
              f'Vita {version}\n\n'
              '下载 Vita APK 后直接覆盖安装；请勿卸载已有应用。\n\n'
              '保持原有包名与签名，数据库按现有迁移升级。设置页支持检查、下载并安装后续 GitHub 更新。\n\n'
              '附件包含版本/签名清单与 SHA256SUMS。系统安装界面仍需确认。\n',
              encoding='utf-8',
          )
          PY
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$RELEASE_TAG" build/distribution/*.apk build/distribution/release-manifest.json build/distribution/SHA256SUMS --verify-tag --title "Vita $VERSION_NAME" --notes-file build/distribution/release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" build/distribution/*.apk build/distribution/release-manifest.json build/distribution/SHA256SUMS --target "$GITHUB_SHA" --title "Vita $VERSION_NAME" --notes-file build/distribution/release-notes.md --latest
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vita-original.keystore"
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-reports
          path: app/build/reports/
          if-no-files-found: ignore
